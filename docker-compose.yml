services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:20
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/sanmati
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "npm install && npm run seed && npm run dev"

volumes:
  mongo-data:
